<script>

"use strict";


const API_URL =
  "/api/generate";


const MAX_FILES =
  50;


const MAX_ORIGINAL_SIZE =
  20 * 1024 * 1024;


const MAX_SEND_SIZE =
  3 * 1024 * 1024;


const MAX_DIMENSION =
  3000;


let selectedFiles = [];

let results = [];

let queueRunning = false;

let paused = false;

let stopped = false;


const imageInput =
  document.getElementById(
    "imageInput"
  );


const fileCount =
  document.getElementById(
    "fileCount"
  );


const generateBtn =
  document.getElementById(
    "generateBtn"
  );


const statusBox =
  document.getElementById(
    "status"
  );


const progress =
  document.getElementById(
    "progress"
  );


const progressFill =
  document.getElementById(
    "progressFill"
  );


const progressText =
  document.getElementById(
    "progressText"
  );


const resultsCard =
  document.getElementById(
    "resultsCard"
  );


const resultsContainer =
  document.getElementById(
    "resultsContainer"
  );


const summary =
  document.getElementById(
    "summary"
  );


const pauseBtn =
  document.getElementById(
    "pauseBtn"
  );


const resumeBtn =
  document.getElementById(
    "resumeBtn"
  );


const stopBtn =
  document.getElementById(
    "stopBtn"
  );


/* =========================
   FILE SELECTION
========================= */

imageInput.addEventListener(
  "change",
  function() {

    const files =
      Array.from(
        this.files
      );


    if (
      files.length >
      MAX_FILES
    ) {

      showStatus(
        `Maximum ${MAX_FILES} images allowed.`,
        "error"
      );

      this.value = "";

      selectedFiles = [];

      updateFileCount();

      return;

    }


    const invalid =
      files.find(
        file =>
          !file.type.startsWith(
            "image/"
          )
      );


    if (invalid) {

      showStatus(
        "Only image files are allowed.",
        "error"
      );

      this.value = "";

      selectedFiles = [];

      updateFileCount();

      return;

    }


    const tooLarge =
      files.find(
        file =>
          file.size >
          MAX_ORIGINAL_SIZE
      );


    if (tooLarge) {

      showStatus(
        `"${tooLarge.name}" is larger than 20 MB.`,
        "error"
      );

      this.value = "";

      selectedFiles = [];

      updateFileCount();

      return;

    }


    selectedFiles =
      files;


    updateFileCount();


    if (
      selectedFiles.length
    ) {

      showStatus(
        `${selectedFiles.length} image(s) ready.`,
        "success"
      );

    }

  }
);


function updateFileCount() {

  fileCount.textContent =
    selectedFiles.length
      ? `${selectedFiles.length} image(s) selected.`
      : "No images selected.";

}


function showStatus(
  message,
  type
) {

  statusBox.textContent =
    message;

  statusBox.className =
    `status ${type}`;

}


/* =========================
   HELPERS
========================= */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


function formatBytes(bytes) {

  if (!bytes) {
    return "0 Bytes";
  }

  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB"
  ];

  const index =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );

  return (
    parseFloat(
      (
        bytes /
        Math.pow(
          1024,
          index
        )
      ).toFixed(2)
    ) +
    " " +
    units[index]
  );

}


/* =========================
   IMAGE PROCESSING
========================= */

function loadImage(file) {

  return new Promise(
    (resolve,reject) => {

      const url =
        URL.createObjectURL(
          file
        );

      const image =
        new Image();

      image.onload =
        function() {

          URL.revokeObjectURL(
            url
          );

          resolve(image);

        };

      image.onerror =
        function() {

          URL.revokeObjectURL(
            url
          );

          reject(
            new Error(
              "Unable to read image."
            )
          );

        };

      image.src =
        url;

    }
  );

}


function canvasToBlob(
  canvas,
  quality
) {

  return new Promise(
    resolve => {

      canvas.toBlob(
        resolve,
        "image/jpeg",
        quality
      );

    }
  );

}


async function compressImage(
  file
) {

  const image =
    await loadImage(
      file
    );


  let width =
    image.naturalWidth;


  let height =
    image.naturalHeight;


  const scale =
    Math.min(
      1,
      MAX_DIMENSION /
      Math.max(
        width,
        height
      )
    );


  width =
    Math.round(
      width * scale
    );


  height =
    Math.round(
      height * scale
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;


  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d"
    );


  if (!ctx) {

    throw new Error(
      "Browser canvas is not available."
    );

  }


  ctx.drawImage(
    image,
    0,
    0,
    width,
    height
  );


  let quality =
    0.88;


  let blob =
    await canvasToBlob(
      canvas,
      quality
    );


  if (!blob) {

    throw new Error(
      "Unable to compress image."
    );

  }


  while (
    blob.size >
    MAX_SEND_SIZE &&
    quality >
    0.45
  ) {

    quality -=
      0.07;


    blob =
      await canvasToBlob(
        canvas,
        quality
      );


    if (!blob) {

      throw new Error(
        "Unable to compress image."
      );

    }

  }


  if (
    blob.size >
    MAX_SEND_SIZE
  ) {

    throw new Error(
      "Image could not be compressed below the upload limit."
    );

  }


  return blob;

}


function blobToBase64(
  blob
) {

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onloadend =
        function() {

          const result =
            String(
              reader.result
            );

          const parts =
            result.split(",");


          if (
            parts.length < 2
          ) {

            reject(
              new Error(
                "Unable to convert image."
              )
            );

            return;

          }


          resolve(
            parts[1]
          );

        };

      reader.onerror =
        function() {

          reject(
            new Error(
              "Unable to read compressed image."
            )
          );

        };

      reader.readAsDataURL(
        blob
      );

    }
  );

}


/* =========================
   AI REQUEST
========================= */

async function callAI(
  file,
  category,
  description
) {

  const compressed =
    await compressImage(
      file
    );


  const base64 =
    await blobToBase64(
      compressed
    );


  const response =
    await fetch(
      API_URL,
      {

        method:
          "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            image:
              base64,

            mimeType:
              "image/jpeg",

            category:
              category,

            description:
              description

          })

      }
    );


  let data;


  try {

    data =
      await response.json();

  } catch(error) {

    throw new Error(
      `Server returned an invalid response (${response.status}).`
    );

  }


  if (
    !response.ok
  ) {

    throw new Error(
      data.details ||
      data.error ||
      `AI request failed (${response.status}).`
    );

  }


  if (
    !data.title ||
    !data.description ||
    !Array.isArray(
      data.keywords
    )
  ) {

    throw new Error(
      "Incomplete metadata returned."
    );

  }


  return {

    title:
      data.title,

    description:
      data.description,

    keywords:
      data.keywords

  };

}


/* =========================
   RESULT OBJECT
========================= */

function createResult(
  file,
  index
) {

  return {

    index:
      index,

    file:
      file,

    filename:
      file.name,

    status:
      "waiting",

    title:
      "",

    description:
      "",

    keywords:
      [],

    error:
      "",

    thumb:
      URL.createObjectURL(
        file
      )

  };

}


/* =========================
   PROCESS ONE IMAGE
========================= */

async function processIndex(
  index
) {

  const item =
    results[index];


  if (!item) {
    return;
  }


  item.status =
    "processing";


  item.error =
    "";


  renderResults();


  try {

    const category =
      document.getElementById(
        "category"
      ).value;


    const description =
      document.getElementById(
        "description"
      ).value;


    showStatus(
      `🤖 Processing: ${item.filename}`,
      "loading"
    );


    const metadata =
      await callAI(
        item.file,
        category,
        description
      );


    item.title =
      metadata.title;


    item.description =
      metadata.description;


    item.keywords =
      metadata.keywords;


    item.status =
      "success";


  } catch(error) {

    item.status =
      "failed";


    item.error =
      error.message ||
      "Unknown error.";

  }


  renderResults();

}


/* =========================
   START BATCH
   FIXED FUNCTION
========================= */

async function generateBatch() {

  try {

    if (
      queueRunning
    ) {

      return;

    }


    if (
      selectedFiles.length === 0
    ) {

      showStatus(
        "Please select at least one image.",
        "error"
      );

      return;

    }


    /* Disable button immediately */

    generateBtn.disabled =
      true;


    showStatus(
      `🚀 Starting batch processing for ${selectedFiles.length} image(s)...`,
      "loading"
    );


    /* Clear old thumbnails */

    results.forEach(
      item => {

        if (
          item.thumb
        ) {

          URL.revokeObjectURL(
            item.thumb
          );

        }

      }
    );


    /* Create fresh results */

    results =
      selectedFiles.map(
        (
          file,
          index
        ) =>
          createResult(
            file,
            index
          )
      );


    /* Reset progress */

    progressFill.style.width =
      "0%";


    progressText.textContent =
      `0 / ${results.length}`;


    resultsCard.style.display =
      "block";


    progress.style.display =
      "block";


    renderResults();


    /* Start queue */

    await startQueue();

  } catch(error) {

    queueRunning =
      false;


    generateBtn.disabled =
      false;


    showStatus(
      `❌ ${error.message || "Unable to start batch processing."}`,
      "error"
    );

  }

}


/* =========================
   QUEUE
========================= */

async function startQueue() {

  if (
    queueRunning
  ) {

    return;

  }


  if (
    results.length === 0
  ) {

    generateBtn.disabled =
      false;

    return;

  }


  queueRunning =
    true;


  paused =
    false;


  stopped =
    false;


  pauseBtn.disabled =
    false;


  resumeBtn.disabled =
    true;


  stopBtn.disabled =
    false;


  generateBtn.disabled =
    true;


  progress.style.display =
    "block";


  resultsCard.style.display =
    "block";


  const total =
    results.length;


  for (
    let i = 0;
    i < total;
    i++
  ) {

    if (
      stopped
    ) {

      break;

    }


    while (
      paused &&
      !stopped
    ) {

      await sleep(
        500
      );

    }


    if (
      stopped
    ) {

      break;

    }


    const item =
      results[i];


    if (
      !item ||
      item.status !==
      "waiting"
    ) {

      continue;

    }


    progressText.textContent =
      `Processing ${i + 1} / ${total}: ${item.filename}`;


    await processIndex(
      i
    );


    updateProgress();


    if (
      !stopped &&
      i <
      total - 1
    ) {

      await sleep(
        900
      );

    }

  }


  queueRunning =
    false;


  generateBtn.disabled =
    false;


  pauseBtn.disabled =
    true;


  resumeBtn.disabled =
    true;


  stopBtn.disabled =
    true;


  updateProgress();


  const successful =
    results.filter(
      item =>
        item.status ===
        "success"
    ).length;


  const failed =
    results.filter(
      item =>
        item.status ===
        "failed"
    ).length;


  const waiting =
    results.filter(
      item =>
        item.status ===
        "waiting"
    ).length;


  if (
    stopped
  ) {

    showStatus(
      `⏹️ Queue stopped. ${successful} successful, ${failed} failed, ${waiting} waiting.`,
      "error"
    );

  } else if (
    failed === 0 &&
    waiting === 0
  ) {

    showStatus(
      `✅ Finished! ${successful} image(s) processed successfully.`,
      "success"
    );

  } else {

    showStatus(
      `⚠️ Finished. ${successful} successful, ${failed} failed, ${waiting} waiting.`,
      "error"
    );

  }

}


/* =========================
   PROGRESS
========================= */

function updateProgress() {

  const total =
    results.length;


  const completed =
    results.filter(
      item =>
        item.status === "success" ||
        item.status === "failed"
    ).length;


  const percent =
    total
      ? Math.round(
          (
            completed /
            total
          ) * 100
        )
      : 0;


  progressFill.style.width =
    `${percent}%`;


  progressText.textContent =
    `${completed} / ${total} completed`;

}


/* =========================
   PAUSE / RESUME / STOP
========================= */

function pauseQueue() {

  if (
    !queueRunning
  ) {

    return;

  }


  paused =
    true;


  pauseBtn.disabled =
    true;


  resumeBtn.disabled =
    false;


  showStatus(
    "⏸️ Queue paused. Current request will finish first.",
    "loading"
  );

}


function resumeQueue() {

  if (
    !queueRunning
  ) {

    return;

  }


  paused =
    false;


  pauseBtn.disabled =
    false;


  resumeBtn.disabled =
    true;


  showStatus(
    "▶️ Queue resumed.",
    "loading"
  );

}


function stopQueue() {

  if (
    !queueRunning
  ) {

    return;

  }


  stopped =
    true;


  paused =
    false;


  showStatus(
    "⏹️ Stopping after the current request...",
    "error"
  );

}


/* =========================
   RETRY FAILED
========================= */

async function retryFailed() {

  if (
    queueRunning
  ) {

    alert(
      "Please wait until the current batch finishes."
    );

    return;

  }


  const failed =
    results.filter(
      item =>
        item.status ===
        "failed"
    );


  if (
    failed.length === 0
  ) {

    alert(
      "There are no failed images."
    );

    return;

  }


  failed.forEach(
    item => {

      item.status =
        "waiting";

      item.error =
        "";

    }
  );


  renderResults();


  showStatus(
    `🔄 Retrying ${failed.length} failed image(s)...`,
    "loading"
  );


  await startQueue();

}


/* =========================
   REGENERATE
========================= */

async function regenerate(
  index
) {

  if (
    queueRunning
  ) {

    alert(
      "Please wait until the current batch finishes."
    );

    return;

  }


  const item =
    results[index];


  if (!item) {
    return;
  }


  item.status =
    "processing";


  item.error =
    "";


  renderResults();


  try {

    const category =
      document.getElementById(
        "category"
      ).value;


    const description =
      document.getElementById(
        "description"
      ).value;


    const metadata =
      await callAI(
        item.file,
        category,
        description
      );


    item.title =
      metadata.title;


    item.description =
      metadata.description;


    item.keywords =
      metadata.keywords;


    item.status =
      "success";


    showStatus(
      `✅ ${item.filename} regenerated successfully.`,
      "success"
    );


  } catch(error) {

    item.status =
      "failed";


    item.error =
      error.message ||
      "Unknown error.";


    showStatus(
      `❌ ${item.filename}: ${item.error}`,
      "error"
    );

  }


  renderResults();

}


/* =========================
   COPY ONE
========================= */

async function copyItem(
  index
) {

  const item =
    results[index];


  if (
    !item ||
    item.status !==
    "success"
  ) {

    return;

  }


  const text =
`FILENAME:
${item.filename}

TITLE:
${item.title}

DESCRIPTION:
${item.description}

KEYWORDS:
${item.keywords.join(", ")}`;


  try {

    await navigator.clipboard.writeText(
      text
    );

    alert(
      "Metadata copied!"
    );

  } catch(error) {

    alert(
      "Unable to copy metadata."
    );

  }

}


/* =========================
   DELETE ITEM
========================= */

function deleteItem(
  index
) {

  const item =
    results[index];


  if (!item) {
    return;
  }


  if (
    item.thumb
  ) {

    URL.revokeObjectURL(
      item.thumb
    );

  }


  results.splice(
    index,
    1
  );


  renderResults();

  updateProgress();

}


/* =========================
   RENDER RESULTS
========================= */

function renderResults() {

  resultsContainer.innerHTML =
    "";


  results.forEach(
    function(
      item,
      index
    ) {

      const box =
        document.createElement(
          "div"
        );


      box.className =
        `result-item ${item.status}`;


      let statusText =
        "Waiting";


      if (
        item.status ===
        "processing"
      ) {

        statusText =
          "🤖 Processing...";

      }


      if (
        item.status ===
        "success"
      ) {

        statusText =
          "✅ Generated";

      }


      if (
        item.status ===
        "failed"
      ) {

        statusText =
          "❌ Failed";

      }


      let content =
        "";


      if (
        item.status ===
        "success"
      ) {

        const keywords =
          item.keywords
            .map(
              (
                keyword,
                keywordIndex
              ) =>
                `<span class="keyword">
                  ${keywordIndex + 1}. ${escapeHTML(keyword)}
                </span>`
            )
            .join("");


        content = `

          <div class="meta-title">
            📌 Title
          </div>

          <div>
            ${escapeHTML(item.title)}
          </div>

          <div class="meta-title">
            📝 Description
          </div>

          <div class="description">
            ${escapeHTML(item.description)}
          </div>

          <div class="meta-title">
            🔑 Keywords (${item.keywords.length})
          </div>

          <div class="keywords">
            ${keywords}
          </div>

        `;

      }


      if (
        item.status ===
        "failed"
      ) {

        content = `

          <div class="meta-title">
            ❌ Error
          </div>

          <div class="description">
            ${escapeHTML(item.error)}
          </div>

        `;

      }


      box.innerHTML = `

        <div class="result-top">

          <img
            class="thumb"
            src="${item.thumb}"
            alt=""
          >

          <div class="result-info">

            <div class="filename">
              ${index + 1}. ${escapeHTML(item.filename)}
            </div>

            <div class="result-status">
              ${statusText}
            </div>

          </div>

        </div>

        ${content}

        <div class="item-actions">

          ${
            item.status === "success"
              ? `
                <button
                  type="button"
                  class="copy-btn"
                  onclick="copyItem(${index})"
                >
                  📋 Copy
                </button>
              `
              : ""
          }

          ${
            item.status === "failed"
              ? `
                <button
                  type="button"
                  class="retry-btn"
                  onclick="regenerate(${index})"
                >
                  🔄 Retry
                </button>
              `
              : ""
          }

          ${
            item.status === "success"
              ? `
                <button
                  type="button"
                  class="retry-btn"
                  onclick="regenerate(${index})"
                >
                  🔁 Regenerate
                </button>
              `
              : ""
          }

          <button
            type="button"
            class="clear-btn"
            onclick="deleteItem(${index})"
          >
            🗑️ Remove
          </button>

        </div>

      `;


      resultsContainer.appendChild(
        box
      );

    }
  );


  const successful =
    results.filter(
      item =>
        item.status ===
        "success"
    ).length;


  const failed =
    results.filter(
      item =>
        item.status ===
        "failed"
    ).length;


  const processing =
    results.filter(
      item =>
        item.status ===
        "processing"
    ).length;


  const waiting =
    results.filter(
      item =>
        item.status ===
        "waiting"
    ).length;


  summary.innerHTML = `

    📊 Total:
    <strong>${results.length}</strong>

    &nbsp; · &nbsp;

    ✅ Success:
    <strong>${successful}</strong>

    &nbsp; · &nbsp;

    ❌ Failed:
    <strong>${failed}</strong>

    &nbsp; · &nbsp;

    🤖 Processing:
    <strong>${processing}</strong>

    &nbsp; · &nbsp;

    ⏳ Waiting:
    <strong>${waiting}</strong>

  `;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   COPY ALL
========================= */

async function copyAllResults() {

  const successful =
    results.filter(
      item =>
        item.status ===
        "success"
    );


  if (
    successful.length === 0
  ) {

    alert(
      "No successful metadata available."
    );

    return;

  }


  const text =
    successful
      .map(
        item =>
`FILENAME:
${item.filename}

TITLE:
${item.title}

DESCRIPTION:
${item.description}

KEYWORDS:
${item.keywords.join(", ")}

----------------------------`
      )
      .join("\n\n");


  try {

    await navigator.clipboard.writeText(
      text
    );

    alert(
      `${successful.length} metadata result(s) copied!`
    );

  } catch(error) {

    alert(
      "Unable to copy metadata."
    );

  }

}


/* =========================
   CSV
========================= */

function escapeCSV(
  value
) {

  return `"${String(value)
    .replace(
      /"/g,
      '""'
    )}"`;

}


function downloadCSV() {

  const successful =
    results.filter(
      item =>
        item.status ===
        "success"
    );


  if (
    successful.length === 0
  ) {

    alert(
      "No successful metadata available."
    );

    return;

  }


  const headers = [

    "Filename",

    "Title",

    "Description",

    "Keywords"

  ];


  const rows =
    successful.map(
      item => [

        item.filename,

        item.title,

        item.description,

        item.keywords.join(
          ", "
        )

      ]
    );


  const csv =
    headers
      .map(
        escapeCSV
      )
      .join(",") +

    "\n" +

    rows
      .map(
        row =>
          row
            .map(
              escapeCSV
            )
            .join(",")
      )
      .join("\n");


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    "ai-stock-metadata-v5.csv";


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  URL.revokeObjectURL(
    url
  );

}


/* =========================
   CLEAR RESULTS
========================= */

function clearResults() {

  if (
    queueRunning
  ) {

    alert(
      "Please stop the current queue first."
    );

    return;

  }


  results.forEach(
    item => {

      if (
        item.thumb
      ) {

        URL.revokeObjectURL(
          item.thumb
        );

      }

    }
  );


  results =
    [];


  resultsContainer.innerHTML =
    "";


  resultsCard.style.display =
    "none";


  progress.style.display =
    "none";


  progressFill.style.width =
    "0%";


  progressText.textContent =
    "0 / 0";


  showStatus(
    "Results cleared.",
    "success"
  );

}

</script>
