<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>AI Stock Metadata Generator V3</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #f5f7fb,
      #eef3ff
    );

  color: #172033;
}

.container {
  width: min(
    950px,
    calc(100% - 28px)
  );

  margin: 30px auto 60px;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.header h1 {
  margin: 0;
  font-size: 32px;
}

.header p {
  color: #667085;
  margin-top: 8px;
}

.card {
  background: white;
  border-radius: 22px;
  padding: 25px;
  margin-bottom: 22px;

  box-shadow:
    0 10px 35px
    rgba(20, 40, 80, 0.08);
}

label {
  display: block;
  font-weight: 700;
  font-size: 17px;
  margin-bottom: 10px;
}

input[type="file"],
select,
textarea {
  width: 100%;
}

select,
textarea {
  border: 1px solid #d0d5dd;
  border-radius: 15px;
  padding: 15px;
  font-size: 16px;
  background: #fff;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

.upload-box {
  border: 2px dashed #c7d2fe;
  border-radius: 18px;
  padding: 25px;
  text-align: center;
  background: #f8faff;
}

input[type="file"] {
  font-size: 15px;
}

.preview {
  margin-top: 18px;
  text-align: center;
}

.preview img {
  max-width: 100%;
  max-height: 380px;
  border-radius: 16px;
}

.file-info {
  color: #667085;
  margin-top: 8px;
}

button {
  border: none;
  cursor: pointer;
  border-radius: 14px;
  padding: 15px 20px;
  font-size: 16px;
  font-weight: 700;
}

.generate-btn {
  width: 100%;
  margin-top: 20px;
  background: #2563eb;
  color: white;
  font-size: 18px;
}

.generate-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.status {
  margin-top: 18px;
  padding: 16px;
  border-radius: 15px;
  display: none;
}

.status.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.status.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.status.loading {
  display: block;
  background: #e0ecff;
  color: #1d4ed8;
}

.result-box {
  border: 1px solid #e4e7ec;
  border-radius: 17px;
  padding: 20px;
  margin-bottom: 18px;
  background: #fafbfc;
}

.result-title {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: 13px;
}

.result-text {
  line-height: 1.6;
  white-space: pre-wrap;
}

.keywords {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.keyword {
  background: #eef2ff;
  color: #3730a3;
  border-radius: 999px;
  padding: 7px 11px;
  font-size: 14px;
}

.action-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 15px;
}

.copy-btn {
  background: #111827;
  color: white;
}

.copy-btn.secondary {
  background: #475467;
}

.csv-btn {
  background: #15803d;
  color: white;
}

.counter {
  margin-top: 12px;
  font-weight: 700;
  color: #475467;
}

.footer {
  text-align: center;
  color: #667085;
  font-size: 14px;
  margin-top: 25px;
}

@media (max-width: 600px) {

  .container {
    width: calc(100% - 20px);
    margin-top: 18px;
  }

  .card {
    padding: 18px;
    border-radius: 18px;
  }

  .header h1 {
    font-size: 26px;
  }

  .action-row button {
    width: 100%;
  }

}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>✨ AI Stock Metadata Generator</h1>

    <p>
      Generate professional stock metadata with AI
    </p>

  </div>

  <div class="card">

    <label>Upload Image</label>

    <div class="upload-box">

      <input
        id="imageInput"
        type="file"
        accept="image/*"
      >

      <div class="file-info" id="fileInfo">
        Maximum original file size: 20 MB
      </div>

      <div
        class="preview"
        id="preview"
      ></div>

    </div>

    <br>

    <label>Content Category</label>

    <select id="category">

      <option>Food</option>
      <option>Nature</option>
      <option>Business</option>
      <option>Technology</option>
      <option>Lifestyle</option>
      <option>Travel</option>
      <option>People</option>
      <option>Architecture</option>
      <option>Objects</option>
      <option>Background</option>
      <option>Other</option>

    </select>

    <br><br>

    <label>Additional Description</label>

    <textarea
      id="description"
      placeholder="Optional: describe anything important about the image..."
    ></textarea>

    <button
      class="generate-btn"
      id="generateBtn"
    >
      ✨ Generate AI Metadata
    </button>

    <div
      id="status"
      class="status"
    ></div>

  </div>


  <div
    class="card"
    id="results"
    style="display:none;"
  >

    <h2>Generated Metadata</h2>

    <div class="result-box">

      <div class="result-title">
        📌 Title
      </div>

      <div
        class="result-text"
        id="titleResult"
      ></div>

      <div class="action-row">

        <button
          class="copy-btn"
          onclick="copyTitle()"
        >
          📋 Copy Title
        </button>

      </div>

    </div>


    <div class="result-box">

      <div class="result-title">
        📝 Description
      </div>

      <div
        class="result-text"
        id="descriptionResult"
      ></div>

      <div class="action-row">

        <button
          class="copy-btn"
          onclick="copyDescription()"
        >
          📋 Copy Description
        </button>

      </div>

    </div>


    <div class="result-box">

      <div class="result-title">
        🔑 Keywords
      </div>

      <div
        class="keywords"
        id="keywordsResult"
      ></div>

      <div
        class="counter"
        id="keywordCounter"
      ></div>

      <div class="action-row">

        <button
          class="copy-btn"
          onclick="copyKeywords()"
        >
          📋 Copy Keywords
        </button>

      </div>

    </div>


    <div class="result-box">

      <div class="result-title">
        📦 Complete Metadata
      </div>

      <div class="action-row">

        <button
          class="copy-btn"
          onclick="copyAll()"
        >
          📋 Copy All Metadata
        </button>

        <button
          class="csv-btn"
          onclick="downloadCSV()"
        >
          📥 Export CSV
        </button>

      </div>

    </div>

  </div>


  <div class="footer">

    AI Stock Metadata Generator V3

  </div>

</div>


<script>

const VERCEL_API = "/api/generate";

const MAX_ORIGINAL_SIZE =
  20 * 1024 * 1024;

const MAX_SEND_SIZE =
  3 * 1024 * 1024;

const MAX_DIMENSION = 3000;

let selectedFile = null;

let generatedMetadata = null;


const imageInput =
  document.getElementById(
    "imageInput"
  );

const generateBtn =
  document.getElementById(
    "generateBtn"
  );

const statusBox =
  document.getElementById(
    "status"
  );

const preview =
  document.getElementById(
    "preview"
  );

const fileInfo =
  document.getElementById(
    "fileInfo"
  );


imageInput.addEventListener(
  "change",
  function () {

    const file =
      this.files[0];

    if (!file) {
      return;
    }

    if (!file.type.startsWith("image/")) {

      showStatus(
        "Please select an image file.",
        "error"
      );

      this.value = "";

      return;
    }

    if (
      file.size >
      MAX_ORIGINAL_SIZE
    ) {

      showStatus(
        "Image is too large. Maximum original file size is 20 MB.",
        "error"
      );

      this.value = "";

      return;
    }

    selectedFile = file;

    fileInfo.textContent =
      `${file.name} · ${formatBytes(file.size)}`;

    const reader =
      new FileReader();

    reader.onload =
      function (event) {

        preview.innerHTML = `
          <img
            src="${event.target.result}"
            alt="Image preview"
          >
        `;

      };

    reader.readAsDataURL(file);

    showStatus(
      "Image ready. You can generate metadata.",
      "success"
    );

  }
);


function showStatus(
  message,
  type
) {

  statusBox.textContent =
    message;

  statusBox.className =
    `status ${type}`;

}


function formatBytes(bytes) {

  if (bytes === 0) {
    return "0 Bytes";
  }

  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB"
  ];

  const index =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );

  return (
    parseFloat(
      (
        bytes /
        Math.pow(1024, index)
      ).toFixed(2)
    ) +
    " " +
    units[index]
  );

}


async function compressImage(file) {

  const image =
    await loadImage(file);

  let width =
    image.naturalWidth;

  let height =
    image.naturalHeight;

  const scale =
    Math.min(
      1,
      MAX_DIMENSION /
      Math.max(width, height)
    );

  width =
    Math.round(
      width * scale
    );

  height =
    Math.round(
      height * scale
    );

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    width;

  canvas.height =
    height;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    image,
    0,
    0,
    width,
    height
  );

  let quality = 0.88;

  let blob =
    await canvasToBlob(
      canvas,
      "image/jpeg",
      quality
    );

  while (
    blob.size >
    MAX_SEND_SIZE &&
    quality > 0.45
  ) {

    quality -= 0.07;

    blob =
      await canvasToBlob(
        canvas,
        "image/jpeg",
        quality
      );

  }

  if (
    blob.size >
    MAX_SEND_SIZE
  ) {

    throw new Error(
      "The image could not be compressed below the upload limit."
    );

  }

  return blob;

}


function loadImage(file) {

  return new Promise(
    (resolve, reject) => {

      const url =
        URL.createObjectURL(file);

      const image =
        new Image();

      image.onload =
        function () {

          URL.revokeObjectURL(
            url
          );

          resolve(image);

        };

      image.onerror =
        function () {

          URL.revokeObjectURL(
            url
          );

          reject(
            new Error(
              "Unable to read this image."
            )
          );

        };

      image.src =
        url;

    }
  );

}


function canvasToBlob(
  canvas,
  type,
  quality
) {

  return new Promise(
    resolve => {

      canvas.toBlob(
        resolve,
        type,
        quality
      );

    }
  );

}


function blobToBase64(blob) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onloadend =
        function () {

          const result =
            reader.result;

          const base64 =
            result.split(",")[1];

          resolve(base64);

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(blob);

    }
  );

}


generateBtn.addEventListener(
  "click",
  async function () {

    if (!selectedFile) {

      showStatus(
        "Please upload an image first.",
        "error"
      );

      return;

    }

    generateBtn.disabled =
      true;

    generatedMetadata =
      null;

    document.getElementById(
      "results"
    ).style.display = "none";

    try {

      showStatus(
        "⚡ Optimizing image...",
        "loading"
      );

      const compressedBlob =
        await compressImage(
          selectedFile
        );

      showStatus(
        `🤖 Sending image to Gemini... (${formatBytes(compressedBlob.size)})`,
        "loading"
      );

      const cleanBase64 =
        await blobToBase64(
          compressedBlob
        );

      const category =
        document.getElementById(
          "category"
        ).value;

      const description =
        document.getElementById(
          "description"
        ).value;

      const response =
        await fetch(
          VERCEL_API,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                image:
                  cleanBase64,

                mimeType:
                  "image/jpeg",

                category:
                  category,

                description:
                  description

              })

          }
        );

      const data =
        await response.json();

      if (!response.ok) {

        const errorMessage =
          data.details ||
          data.error ||
          "Failed to generate metadata.";

        throw new Error(
          errorMessage
        );

      }

      if (
        !data.title ||
        !data.description ||
        !Array.isArray(data.keywords)
      ) {

        throw new Error(
          "Incomplete metadata received from AI."
        );

      }

      if (
        data.keywords.length !== 49
      ) {

        throw new Error(
          `AI returned ${data.keywords.length} keywords instead of 49.`
        );

      }

      generatedMetadata = {

        title:
          data.title,

        description:
          data.description,

        keywords:
          data.keywords

      };

      renderResults();

      showStatus(
        "✅ Metadata generated successfully!",
        "success"
      );

    } catch (error) {

      console.error(
        error
      );

      showStatus(
        "Gagal membuat metadata: " +
        error.message,
        "error"
      );

    } finally {

      generateBtn.disabled =
        false;

    }

  }
);


function renderResults() {

  document.getElementById(
    "results"
  ).style.display = "block";

  document.getElementById(
    "titleResult"
  ).textContent =
    generatedMetadata.title;

  document.getElementById(
    "descriptionResult"
  ).textContent =
    generatedMetadata.description;

  const keywordContainer =
    document.getElementById(
      "keywordsResult"
    );

  keywordContainer.innerHTML =
    "";

  generatedMetadata.keywords
    .forEach(
      function (keyword, index) {

        const span =
          document.createElement(
            "span"
          );

        span.className =
          "keyword";

        span.textContent =
          `${index + 1}. ${keyword}`;

        keywordContainer.appendChild(
          span
        );

      }
    );

  document.getElementById(
    "keywordCounter"
  ).textContent =
    `49 / 49 keywords`;

}


async function copyText(text) {

  await navigator.clipboard.writeText(
    text
  );

}


async function copyTitle() {

  if (!generatedMetadata) {
    return;
  }

  await copyText(
    generatedMetadata.title
  );

  alert(
    "Title copied!"
  );

}


async function copyDescription() {

  if (!generatedMetadata) {
    return;
  }

  await copyText(
    generatedMetadata.description
  );

  alert(
    "Description copied!"
  );

}


async function copyKeywords() {

  if (!generatedMetadata) {
    return;
  }

  const text =
    generatedMetadata.keywords.join(
      ", "
    );

  await copyText(
    text
  );

  alert(
    "49 keywords copied!"
  );

}


async function copyAll() {

  if (!generatedMetadata) {
    return;
  }

  const text =
`TITLE:
${generatedMetadata.title}

DESCRIPTION:
${generatedMetadata.description}

KEYWORDS:
${generatedMetadata.keywords.join(", ")}`;

  await copyText(
    text
  );

  alert(
    "Complete metadata copied!"
  );

}


function escapeCSV(value) {

  return `"${String(value)
    .replace(/"/g, '""')}"`;

}


function downloadCSV() {

  if (!generatedMetadata) {
    return;
  }

  const headers = [
    "Filename",
    "Title",
    "Description",
    "Keywords"
  ];

  const filename =
    selectedFile
      ? selectedFile.name
      : "image";

  const row = [

    filename,

    generatedMetadata.title,

    generatedMetadata.description,

    generatedMetadata.keywords.join(
      ", "
    )

  ];

  const csv =
    headers.map(escapeCSV).join(",") +
    "\n" +
    row.map(escapeCSV).join(",");

  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href =
    url;

  link.download =
    filename.replace(
      /\.[^/.]+$/,
      ""
    ) +
    "-metadata.csv";

  document.body.appendChild(
    link
  );

  link.click();

  link.remove();

  URL.revokeObjectURL(
    url
  );

}

</script>

</body>
</html>
