<script>


const API_URL =
  "/api/generate";


const MAX_FILES =
  50;


const MAX_ORIGINAL_SIZE =
  20 * 1024 * 1024;


const MAX_SEND_SIZE =
  3 * 1024 * 1024;


const MAX_DIMENSION =
  3000;


let selectedFiles = [];

let results = [];


const imageInput =
  document.getElementById(
    "imageInput"
  );


const fileCount =
  document.getElementById(
    "fileCount"
  );


const generateBtn =
  document.getElementById(
    "generateBtn"
  );


const statusBox =
  document.getElementById(
    "status"
  );


const progressWrap =
  document.getElementById(
    "progressWrap"
  );


const progressFill =
  document.getElementById(
    "progressFill"
  );


const progressText =
  document.getElementById(
    "progressText"
  );


const resultsCard =
  document.getElementById(
    "resultsCard"
  );


const resultsContainer =
  document.getElementById(
    "resultsContainer"
  );


const countBox =
  document.getElementById(
    "countBox"
  );


imageInput.addEventListener(
  "change",
  function () {

    const files =
      Array.from(
        this.files
      );

    if (
      files.length >
      MAX_FILES
    ) {

      showStatus(
        `Maximum ${MAX_FILES} images can be selected.`,
        "error"
      );

      this.value = "";

      selectedFiles = [];

      updateFileCount();

      return;

    }


    const invalid =
      files.find(
        file =>
          !file.type.startsWith(
            "image/"
          )
      );


    if (invalid) {

      showStatus(
        "Only image files are allowed.",
        "error"
      );

      this.value = "";

      selectedFiles = [];

      updateFileCount();

      return;

    }


    const tooLarge =
      files.find(
        file =>
          file.size >
          MAX_ORIGINAL_SIZE
      );


    if (tooLarge) {

      showStatus(
        `"${tooLarge.name}" is larger than 20 MB.`,
        "error"
      );

      this.value = "";

      selectedFiles = [];

      updateFileCount();

      return;

    }


    selectedFiles =
      files;


    updateFileCount();


    if (
      selectedFiles.length
    ) {

      showStatus(
        `${selectedFiles.length} image(s) ready for processing.`,
        "success"
      );

    }

  }
);


function updateFileCount() {

  if (
    selectedFiles.length === 0
  ) {

    fileCount.textContent =
      "No images selected.";

    return;

  }


  fileCount.textContent =
    `${selectedFiles.length} image(s) selected.`;

}


function showStatus(
  message,
  type
) {

  statusBox.textContent =
    message;

  statusBox.className =
    `status ${type}`;

}


function formatBytes(
  bytes
) {

  if (
    bytes === 0
  ) {
    return "0 Bytes";
  }


  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB"
  ];


  const index =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );


  return (
    parseFloat(
      (
        bytes /
        Math.pow(
          1024,
          index
        )
      ).toFixed(2)
    ) +
    " " +
    units[index]
  );

}


function loadImage(
  file
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const url =
        URL.createObjectURL(
          file
        );


      const image =
        new Image();


      image.onload =
        function () {

          URL.revokeObjectURL(
            url
          );

          resolve(
            image
          );

        };


      image.onerror =
        function () {

          URL.revokeObjectURL(
            url
          );

          reject(
            new Error(
              "Unable to read image."
            )
          );

        };


      image.src =
        url;

    }
  );

}


function canvasToBlob(
  canvas,
  type,
  quality
) {

  return new Promise(
    resolve => {

      canvas.toBlob(
        resolve,
        type,
        quality
      );

    }
  );

}


async function compressImage(
  file
) {

  const image =
    await loadImage(
      file
    );


  let width =
    image.naturalWidth;


  let height =
    image.naturalHeight;


  const scale =
    Math.min(
      1,
      MAX_DIMENSION /
      Math.max(
        width,
        height
      )
    );


  width =
    Math.round(
      width * scale
    );


  height =
    Math.round(
      height * scale
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;


  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    image,
    0,
    0,
    width,
    height
  );


  let quality =
    0.88;


  let blob =
    await canvasToBlob(
      canvas,
      "image/jpeg",
      quality
    );


  while (
    blob.size >
    MAX_SEND_SIZE &&
    quality >
    0.45
  ) {

    quality -=
      0.07;


    blob =
      await canvasToBlob(
        canvas,
        "image/jpeg",
        quality
      );

  }


  if (
    blob.size >
    MAX_SEND_SIZE
  ) {

    throw new Error(
      "Unable to compress image below upload limit."
    );

  }


  return blob;

}


function blobToBase64(
  blob
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onloadend =
        function () {

          const result =
            reader.result;


          const base64 =
            result.split(
              ","
            )[1];


          resolve(
            base64
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );

    }
  );

}


async function processImage(
  file,
  category,
  description
) {

  const compressed =
    await compressImage(
      file
    );


  const base64 =
    await blobToBase64(
      compressed
    );


  const response =
    await fetch(
      API_URL,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            image:
              base64,

            mimeType:
              "image/jpeg",

            category:
              category,

            description:
              description

          })

      }
    );


  const data =
    await response.json();


  if (
    !response.ok
  ) {

    throw new Error(
      data.details ||
      data.error ||
      "AI request failed."
    );

  }


  if (
    !data.title ||
    !data.description ||
    !Array.isArray(
      data.keywords
    )
  ) {

    throw new Error(
      "Incomplete metadata returned."
    );

  }


  return {

    filename:
      file.name,

    title:
      data.title,

    description:
      data.description,

    keywords:
      data.keywords

  };

}


async function sleep(
  ms
) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


generateBtn.addEventListener(
  "click",
  async function () {

    if (
      selectedFiles.length === 0
    ) {

      showStatus(
        "Please select at least one image.",
        "error"
      );

      return;

    }


    generateBtn.disabled =
      true;


    results =
      [];


    resultsContainer.innerHTML =
      "";


    resultsCard.style.display =
      "block";


    progressWrap.style.display =
      "block";


    progressFill.style.width =
      "0%";


    progressText.textContent =
      `0 / ${selectedFiles.length}`;


    const category =
      document.getElementById(
        "category"
      ).value;


    const description =
      document.getElementById(
        "description"
      ).value;


    let successCount =
      0;


    let failedCount =
      0;


    for (
      let i = 0;
      i < selectedFiles.length;
      i++
    ) {

      const file =
        selectedFiles[i];


      progressText.textContent =
        `Processing ${i + 1} / ${selectedFiles.length}: ${file.name}`;


      showStatus(
        `🤖 Analyzing ${i + 1}/${selectedFiles.length} — ${file.name}`,
        "loading"
      );


      try {

        const metadata =
          await processImage(
            file,
            category,
            description
          );


        results.push({

          success:
            true,

          ...metadata

        });


        successCount++;


      } catch (
        error
      ) {

        console.error(
          file.name,
          error
        );


        results.push({

          success:
            false,

          filename:
            file.name,

          error:
            error.message

        });


        failedCount++;

      }


      renderResults();


      const percent =
        Math.round(
          (
            (i + 1) /
            selectedFiles.length
          ) *
          100
        );


      progressFill.style.width =
        `${percent}%`;


      // Small pause between requests
      // to reduce rate-limit pressure.

      if (
        i <
        selectedFiles.length - 1
      ) {

        await sleep(
          800
        );

      }

    }


    if (
      failedCount === 0
    ) {

      showStatus(
        `✅ Finished! ${successCount} image(s) processed successfully.`,
        "success"
      );

    } else {

      showStatus(
        `⚠️ Finished: ${successCount} successful, ${failedCount} failed.`,
        "error"
      );

    }


    generateBtn.disabled =
      false;

  }
);


function renderResults() {

  resultsContainer.innerHTML =
    "";


  results.forEach(
    function (
      item,
      index
    ) {

      const box =
        document.createElement(
          "div"
        );


      box.className =
        item.success
          ? "result-item success"
          : "result-item failed";


      if (
        !item.success
      ) {

        box.innerHTML = `

          <div class="result-file">
            ❌ ${index + 1}. ${escapeHTML(item.filename)}
          </div>

          <div>
            Error:
            ${escapeHTML(item.error)}
          </div>

        `;


        resultsContainer.appendChild(
          box
        );

        return;

      }


      const keywordsHTML =
        item.keywords
          .map(
            function (
              keyword,
              keywordIndex
            ) {

              return `
                <span class="keyword">
                  ${keywordIndex + 1}.
                  ${escapeHTML(keyword)}
                </span>
              `;

            }
          )
          .join("");


      box.innerHTML = `

        <div class="result-file">
          ✅ ${index + 1}. ${escapeHTML(item.filename)}
        </div>

        <div class="result-title">
          📌 Title
        </div>

        <div>
          ${escapeHTML(item.title)}
        </div>

        <div class="result-title">
          📝 Description
        </div>

        <div class="result-description">
          ${escapeHTML(item.description)}
        </div>

        <div class="result-title">
          🔑 Keywords
          (${item.keywords.length})
        </div>

        <div class="keyword-list">
          ${keywordsHTML}
        </div>

      `;


      resultsContainer.appendChild(
        box
      );

    }
  );


  const successful =
    results.filter(
      item =>
        item.success
    ).length;


  const failed =
    results.filter(
      item =>
        !item.success
    ).length;


  countBox.textContent =
    `Processed: ${results.length} · Successful: ${successful} · Failed: ${failed}`;

}


function escapeHTML(
  text
) {

  return String(
    text
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


async function copyAllResults() {

  const successful =
    results.filter(
      item =>
        item.success
    );


  if (
    successful.length === 0
  ) {

    alert(
      "No successful metadata available."
    );

    return;

  }


  const text =
    successful
      .map(
        function (
          item
        ) {

          return `

FILENAME:
${item.filename}

TITLE:
${item.title}

DESCRIPTION:
${item.description}

KEYWORDS:
${item.keywords.join(", ")}

----------------------------

`;

        }
      )
      .join("");


  try {

    await navigator.clipboard.writeText(
      text
    );

    alert(
      `${successful.length} metadata result(s) copied!`
    );

  } catch (
    error
  ) {

    alert(
      "Unable to copy metadata."
    );

  }

}


function escapeCSV(
  value
) {

  return `"${String(value)
    .replace(
      /"/g,
      '""'
    )}"`;

}


function downloadCSV() {

  const successful =
    results.filter(
      item =>
        item.success
    );


  if (
    successful.length === 0
  ) {

    alert(
      "No successful metadata available."
    );

    return;

  }


  const headers = [

    "Filename",

    "Title",

    "Description",

    "Keywords"

  ];


  const rows =
    successful.map(
      function (
        item
      ) {

        return [

          item.filename,

          item.title,

          item.description,

          item.keywords.join(
            ", "
          )

        ];

      }
    );


  const csv =

    headers
      .map(
        escapeCSV
      )
      .join(",") +

    "\n" +

    rows
      .map(
        row =>
          row
            .map(
              escapeCSV
            )
            .join(",")
      )
      .join("\n");


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    "ai-stock-metadata-v4.csv";


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  URL.revokeObjectURL(
    url
  );

}


function clearResults() {

  results =
    [];


  resultsContainer.innerHTML =
    "";


  countBox.textContent =
    "";


  resultsCard.style.display =
    "none";


  progressWrap.style.display =
    "none";


  progressFill.style.width =
    "0%";


  progressText.textContent =
    "0 / 0";


  showStatus(
    "Results cleared.",
    "success"
  );

}


</script>
